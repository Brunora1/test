<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Formulario de contacto de IKEA. Proyecto 1º ASIR.">
    <meta name="keywords" content="IKEA, contacto, formulario, ayuda, atención al cliente">
    <meta name="author" content="Estudiante 1º ASIR">
    <title>IKEA España | Contacto</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>

    <header>
        <h1>IKEA</h1>
        <p>Soluciones de decoración y mobiliario para un mejor día a día en el hogar</p>
    </header>

    <nav>
        <a href="../Home/index.html">Inicio</a> | 
        <a href="../About/about.html">Sobre Nosotros</a> | 
        <a href="../Services & Product/services.html">Productos y Servicios</a> | 
        <a href="contact.html" class="activo">Contacto</a>
    </nav>

    <main>
        <div class="seccion">
            <h2>Contacto</h2>
            <p>¿Tienes alguna pregunta o necesitas ayuda con tu pedido? Completa el siguiente formulario:</p>

            <form action="#" method="get">
                <div class="campo-form">
                    <label for="nombre">Nombre y Apellidos:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ej. Juan Pérez" required>
                </div>

                <div class="campo-form">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
                </div>

                <div class="campo-form">
                    <label for="asunto">Asunto:</label>
                    <input type="text" id="asunto" name="asunto" placeholder="Motivo de tu consulta">
                </div>

                <div class="campo-form">
                    <label for="mensaje">Mensaje:</label>
                    <textarea id="mensaje" name="mensaje" rows="4" placeholder="Escribe aquí tu mensaje..."></textarea>
                </div>
                <button type="submit">Enviar Consulta</button>
            </form>
        </div>
    </main>

    <footer>
        <p>2026 IKEA</p>
    </footer>

</body>
</html>
